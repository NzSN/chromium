<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyApp</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 2rem;
      background: #f5f5f5;
      color: #333;
    }
    h1 {
      margin-bottom: 1.5rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background: #e8e8e8;
    }
    button:active {
      background: #ddd;
    }
    #status {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem;
      min-height: 4rem;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>MyApp Native API Demo</h1>
  <div class="controls">
    <button id="btn-read-clipboard">Read Clipboard</button>
    <button id="btn-write-clipboard">Write to Clipboard</button>
    <button id="btn-open-file">Open File</button>
  </div>
  <div id="status">Ready.</div>
  <script src="app.js"></script>
</body>
</html>
